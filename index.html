<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>펄스 서베이</title>
<style>
  :root{
    --yonsei:#003876;      /* 연세 네이비 */
    --yonsei-2:#0A4C93;
    --yonsei-soft:#E5EDF6;
    --bg:#F0F3F7;
    --surface:#FFFFFF;
    --ink:#1A2733;
    --ink-soft:#5C6B7A;
    --line:#D5DEE7;
    --sun:#F2A93B;
    --pos:#2E8B72;
    --neg:#D46A4A;
    --orange:#EE7C30;
    --shadow:0 8px 30px rgba(0,42,90,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg);color:var(--ink);
    display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden;
  }
  .phone{
    width:100%;max-width:440px;height:min(880px,96vh);
    background:var(--surface);border-radius:26px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;overflow:hidden;position:relative;
  }
  /* brand header */
  .brand{padding:16px 24px 0;display:flex;align-items:center;justify-content:space-between;flex:none;}
  .brand .logo{display:flex;align-items:center;gap:9px;}
  .brand .mark{width:26px;height:26px;border-radius:50%;background:var(--yonsei);display:flex;align-items:center;justify-content:center;}
  .brand .mark svg{width:15px;height:15px;}
  .brand .bt{font-size:13px;font-weight:700;color:var(--yonsei);letter-spacing:-.01em;}
  .brand .bt small{display:block;font-size:9.5px;color:var(--ink-soft);font-weight:500;letter-spacing:.02em;}

  .topbar{padding:14px 24px 8px;display:flex;align-items:center;gap:13px;}
  .back{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);flex:none;opacity:0;pointer-events:none;transition:opacity .25s;}
  .back.show{opacity:1;pointer-events:auto;}
  .back svg{width:15px;height:15px;}
  .track{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden;}
  .fill{height:100%;width:0;background:linear-gradient(90deg,var(--yonsei-2),var(--yonsei));border-radius:3px;transition:width .4s cubic-bezier(.4,0,.2,1);}
  .count{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;flex:none;}

  .stage{flex:1;position:relative;overflow:hidden;}
  .card{position:absolute;inset:0;padding:8px 24px 20px;display:flex;flex-direction:column;opacity:0;transform:translateX(40px);pointer-events:none;transition:opacity .36s ease,transform .36s cubic-bezier(.32,.72,0,1);overflow-y:auto;}
  .card.active{opacity:1;transform:none;pointer-events:auto;}
  .card.left{transform:translateX(-40px);}

  .qnum{font-size:12px;letter-spacing:.03em;color:var(--yonsei);font-weight:700;margin-bottom:9px;}
  .qtext{font-size:20px;line-height:1.4;font-weight:680;margin-bottom:5px;letter-spacing:-.01em;}
  .qhint{font-size:13px;color:var(--ink-soft);margin-bottom:18px;}
  .choose{font-size:12.5px;color:var(--yonsei);font-weight:600;margin-bottom:12px;}

  /* icon (weather/face) cards */
  .iconrow{display:flex;flex-wrap:wrap;gap:9px;margin-top:4px;}
  .icard{flex:1 1 calc(33.3% - 6px);min-width:0;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;padding:14px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;transition:border-color .2s,background .2s,transform .12s;}
  .icard:active{transform:scale(.97);}
  .icard.sel{border-color:var(--yonsei);background:var(--yonsei-soft);}
  .icard .ig{width:52px;height:52px;display:flex;align-items:center;justify-content:center;}
  .icard .ig svg{width:50px;height:50px;}
  .icard .il{font-size:13px;font-weight:600;text-align:center;line-height:1.25;}

  /* list options */
  .list{display:flex;flex-direction:column;gap:9px;margin-top:4px;}
  .lopt{display:flex;align-items:center;gap:13px;padding:14px 16px;border:1.5px solid var(--line);border-radius:13px;cursor:pointer;background:var(--surface);transition:border-color .2s,background .2s,transform .12s;}
  .lopt:active{transform:scale(.98);}
  .lopt.sel{border-color:var(--yonsei);background:var(--yonsei-soft);}
  .lopt .key{width:24px;height:24px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--yonsei-soft);color:var(--yonsei);border:1px solid #C3D6EA;}
  .lopt.sel .key{background:var(--yonsei);color:#fff;border-color:var(--yonsei);}
  .lopt .lt{font-size:15px;font-weight:500;line-height:1.35;}
  .lopt.scale .key{color:#fff;border:none;}

  /* multi grid */
  .badge{font-size:12px;color:var(--yonsei);background:var(--yonsei-soft);padding:3px 11px;border-radius:20px;display:inline-block;margin-bottom:14px;font-weight:600;}
  .mgrid{display:flex;flex-wrap:wrap;gap:9px;margin-top:2px;}
  .mopt{flex:1 1 calc(50% - 5px);min-width:0;display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface);transition:all .15s;}
  .mopt:active{transform:scale(.97);}
  .mopt.sel{border-color:var(--yonsei);background:var(--yonsei);}
  .mopt.sel .mk,.mopt.sel .mt{color:#fff;}
  .mopt.sel.pos{border-color:var(--pos);background:var(--pos);}
  .mopt.sel.neg{border-color:var(--neg);background:var(--neg);}
  .mopt .mk{width:22px;height:22px;border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--yonsei-soft);color:var(--yonsei);}
  .mopt.sel .mk{background:rgba(255,255,255,.25);}
  .mopt .mt{font-size:13.5px;font-weight:500;line-height:1.3;}

  .full{flex:1 1 100%;}

  .next{margin:14px 24px 16px;padding:15px;border:none;border-radius:14px;background:var(--yonsei);color:#fff;font-size:15.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .2s,transform .12s;flex:none;}
  .next:disabled{opacity:.35;cursor:default;}
  .next:active:not(:disabled){transform:scale(.98);}

  /* intro / done */
  .center{align-items:center;justify-content:center;text-align:center;}
  .bigmark{width:76px;height:76px;border-radius:50%;background:var(--yonsei);display:flex;align-items:center;justify-content:center;margin-bottom:22px;}
  .bigmark svg{width:40px;height:40px;}
  .center h1{font-size:24px;font-weight:720;margin-bottom:12px;letter-spacing:-.02em;}
  .center p{font-size:14.5px;color:var(--ink-soft);line-height:1.6;max-width:300px;margin-bottom:8px;}
  .start{margin-top:28px;padding:15px 42px;border:none;border-radius:40px;background:var(--yonsei);color:#fff;font-size:15.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .12s;}
  .start:active{transform:scale(.97);}
  .meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px;}
  .meta span{font-size:11.5px;color:var(--ink-soft);border:1px solid var(--line);padding:5px 12px;border-radius:20px;}

  .spinner{width:42px;height:42px;border:4px solid var(--yonsei-soft);border-top-color:var(--yonsei);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .checkmark{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .6s .2s forwards;}
  @keyframes draw{to{stroke-dashoffset:0;}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

  /* wifi signal */
  .wifi{position:relative;width:46px;height:40px;}

.qtext,
.qhint,
.lt,
.mt,
.il,
.center h1,
.center p{
  word-break:keep-all;
  overflow-wrap:break-word;
}


  .other-wrap{flex:1 1 100%;display:none;margin-top:-1px;}
  .other-wrap.show{display:block;}
  .other-input{width:100%;padding:13px 14px;border:1.5px solid var(--yonsei);border-radius:12px;background:#fff;color:var(--ink);font-family:inherit;font-size:14px;outline:none;}
  .other-input:focus{box-shadow:0 0 0 3px rgba(0,56,118,.10);}
  .other-count{display:block;margin-top:5px;text-align:right;font-size:11px;color:var(--ink-soft);}
  .qtext,.qhint,.lt,.mt,.il,.center h1,.center p{word-break:keep-all;overflow-wrap:break-word;}
</style>
</head>
<body>
<div class="phone">
  <div class="brand">
    <div class="logo">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="1.6"/><path d="M8 12l2.5 2.5L16 9" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="bt">연세대학교 의료원<small>인재경영실 · 인재개발센터</small></div>
    </div>
  </div>
  <div class="topbar" id="topbar" style="visibility:hidden">
    <button class="back" id="backBtn" aria-label="이전"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="count" id="count"></div>
  </div>
  <div class="stage" id="stage"></div>
  <button class="next" id="nextBtn" style="display:none">다음</button>
</div>

<script>
/* ===== config ===== */
const CONFIG = { ENDPOINT: "https://script.google.com/…/exec", WAVE: "" };

/* ===== SVG icons ===== */
const sun="#F2A93B",cloud="#8FA6B8",rain="#5C8CB0",storm="#3E5D77",ink="#1A2733",navy="#003876";
function svg(inner){return `<svg viewBox="0 0 48 48" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;}
const WX={
  a:svg(`<circle cx="24" cy="24" r="9" fill="${sun}" stroke="${sun}"/><g stroke="${sun}"><path d="M24 6v4M24 38v4M6 24h4M38 24h4M11 11l3 3M34 34l3 3M37 11l-3 3M14 34l-3 3"/></g>`),
  b:svg(`<circle cx="20" cy="22" r="8" fill="${sun}" stroke="${sun}"/><path d="M26 34h14a5 5 0 0 0 0-10 7 7 0 0 0-13-2" fill="#DCE8F2" stroke="${cloud}"/>`),
  c:svg(`<path d="M14 34h20a7 7 0 0 0 0-14 9 9 0 0 0-17-2 6 6 0 0 0-3 16z" fill="#E4EAF0" stroke="${cloud}"/>`),
  d:svg(`<path d="M14 28h20a7 7 0 0 0 0-14 9 9 0 0 0-17-2 6 6 0 0 0-3 16z" fill="#E4EAF0" stroke="${cloud}"/><g stroke="${rain}"><path d="M17 34l-2 5M24 34l-2 5M31 34l-2 5"/></g>`),
  e:svg(`<path d="M14 26h20a7 7 0 0 0 0-14 9 9 0 0 0-17-2 6 6 0 0 0-3 16z" fill="#D5DEE7" stroke="${storm}"/><path d="M24 28l-4 7h5l-3 7" stroke="${sun}" fill="none"/>`),
};
const FACE={
  a:svg(`<circle cx="24" cy="24" r="17" fill="#FBE2C4" stroke="${sun}"/><path d="M17 21c1-2 3-2 4 0M27 21c1-2 3-2 4 0" stroke="${ink}"/><path d="M16 28c2 5 14 5 16 0" stroke="${ink}"/>`),
  b:svg(`<circle cx="24" cy="24" r="17" fill="#E4EDF4" stroke="#6FA8C7"/><circle cx="19" cy="22" r="1.6" fill="${ink}"/><circle cx="29" cy="22" r="1.6" fill="${ink}"/><path d="M18 29c2 3 10 3 12 0" stroke="${ink}"/>`),
  c:svg(`<circle cx="24" cy="24" r="17" fill="#E7EAEE" stroke="${cloud}"/><circle cx="19" cy="22" r="1.6" fill="${ink}"/><circle cx="29" cy="22" r="1.6" fill="${ink}"/><path d="M18 30h12" stroke="${ink}"/>`),
  d:svg(`<circle cx="24" cy="24" r="17" fill="#ECE6EE" stroke="#9C86A8"/><circle cx="19" cy="22" r="1.6" fill="${ink}"/><circle cx="29" cy="23" r="1.6" fill="${ink}"/><path d="M18 30c2-2 5 1 12-1" stroke="${ink}"/>`),
  e:svg(`<circle cx="24" cy="24" r="17" fill="#F4DAD0" stroke="${storm}"/><path d="M16 20l5 2M32 20l-5 2" stroke="${ink}"/><circle cx="19" cy="24" r="1.6" fill="${ink}"/><circle cx="29" cy="24" r="1.6" fill="${ink}"/><path d="M18 32c2-3 10-3 12 0" stroke="${ink}"/>`),
};
// wifi with N active arcs (of 3), color for on/off
function wifi(level,label){
  const on=navy, off="#C9D2DC";
  const c=(n)=> n<=level?on:off;
  const dot = level>0? on: off;
  const xmark = level===0? `<path d="M6 10l8 8M14 10l-8 8" stroke="#E23B2B" stroke-width="3" stroke-linecap="round"/>`:"";
  return `<svg viewBox="0 0 48 44" fill="none">
    <path d="M6 18a26 26 0 0 1 36 0" stroke="${c(3)}" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M13 26a16 16 0 0 1 22 0" stroke="${c(2)}" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M19 33a7 7 0 0 1 10 0" stroke="${c(1)}" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="24" cy="39" r="3" fill="${dot}"/>
    ${xmark}
  </svg>`;
}

/* ===== survey (원본 15문항 그대로) ===== */
const survey=[
  {id:"intro",type:"intro"},
  // Q1 감정 날씨 (아이콘)
  {id:"q1",type:"icon",cat:"문항 1 · 근무 만족도",q:"최근 1주일간 일하면서 느끼는 선생님의 감정 날씨는 어떤가요?",
    options:[{v:"A",ic:WX.a,l:"아주 맑음"},{v:"B",ic:WX.b,l:"맑음"},{v:"C",ic:WX.c,l:"흐림"},{v:"D",ic:WX.d,l:"비"},{v:"E",ic:WX.e,l:"천둥·비"}]},
  // Q2 번아웃 (단일)
  {id:"q2",type:"single",cat:"문항 2 · 번아웃 정도",q:"선생님께서 느끼는 번아웃 정도는 어떠합니까?",
    options:["매우 번아웃 되어있다.","번아웃 되어있는 편이다.","보통이다.","번아웃 되어있지 않은 편이다.","전혀 번아웃되지 않았다."]},
  // Q3 기분 단어 (2택, 긍/부정 표시)
  {id:"q3",type:"multi",cat:"문항 3 · 기분 표현 단어",q:"현재 선생님이 느낀 기분을 잘 표현하는 단어를 골라주세요.",hint:"2개 단어를 골라주세요",max:2,
    options:[{v:"편안한",c:"pos"},{v:"무기력한",c:"neg"},{v:"우울한",c:"neg"},{v:"만족스러운",c:"pos"},{v:"여유로운",c:"pos"},{v:"짜증나는",c:"neg"},{v:"불안한",c:"neg"},{v:"즐거운",c:"pos"},{v:"화난",c:"neg"}]},
  // Q4 부서장 표정 (아이콘)
  {id:"q4",type:"icon",cat:"문항 4 · 부서장에 대한 인식",q:"이번 주 나의 부서장을 생각하면 나의 표정은 아마도 이럴 것 같다.",
    options:[{v:"A",ic:FACE.a,l:"완전 밝은 표정"},{v:"B",ic:FACE.b,l:"흐뭇한 미소"},{v:"C",ic:FACE.c,l:"무심한, 무뚝뚝"},{v:"D",ic:FACE.d,l:"쌩뚱맞은"},{v:"E",ic:FACE.e,l:"화나는"}]},
  // Q5 부서장 기대 (2택, Other)
  {id:"q5",type:"multi",fullRows:true,cat:"문항 5 · 부서장에게 기대하는 모습",q:"지금 선생님의 부서장에게 기대하는 모습은 무엇인가요?",hint:"2가지 모습을 선택해주세요.",max:2,
    options:[{v:"변화를 주도하는 혁신적인 모습"},{v:"직무에 대한 높은 전문성과 역량"},{v:"직원들의 의견을 경청하고 존중"},{v:"직원을 보호하고 신뢰를 줌"},{v:"공정하고 투명한 의사 결정"},{v:"직원들의 성장을 지원하고 코칭"},{v:"성과에 대한 명확한 기대와 피드백"},{v:"기타"}]},
  // Q6 교육 만족 (단일)
  {id:"q6",type:"single",cat:"문항 6 · 교육 만족도",q:"선생님은 의료원의 교육 제도에 대해 어떻게 생각하시나요?",
    options:["매우 만족","만족","보통","불만족","매우 불만족"]},
  // Q7 교육 인식 (복수, Other)
  {id:"q7",type:"multiopen",cat:"문항 7 · 교육 인식도",q:"선생님이 참여한 적이 있거나 알고 있는 교육 프로그램을 선택해주세요.",hint:"해당하는 프로그램을 모두 선택 (복수 선택 가능)",
    options:["PLOS+","디지털클래스","세브란스 인사이트","소확행클래스","세심한클래스(스트레스, 호신술)","없음","기타"]},
  // Q8 교육 수요 (단일, Other)
  {id:"q8",type:"single",cat:"문항 8 · 교육 수요",q:"현재 선생님에게 가장 필요한 교육의 주제는 무엇입니까?",
    options:["직무","소통(협력, 의사소통 등)","리더십","스트레스 관리(힐링, 번아웃 예방 등)","AI · 디지털","기타"]},
  // Q9 부서 내 소통 (와이파이)
  {id:"q9",type:"wifi",cat:"문항 9 · 부서 내 소통 원활성",q:"우리 부서 내 소통은 얼마나 원활하다고 느끼시나요?",label:"우리부서",
    options:[{v:"A",lv:3,l:"매우 원활"},{v:"B",lv:2,l:"원활한 편"},{v:"C",lv:1,l:"보통"},{v:"D",lv:1,l:"약한 편"},{v:"E",lv:0,l:"거의 안 됨"}]},
  // Q10 타 부서 소통 (와이파이)
  {id:"q10",type:"wifi",cat:"문항 10 · 타 부서 소통 원활성",q:"타 부서와의 소통은 얼마나 원활하다고 느끼시나요?",label:"타 부서",orange:true,
    options:[{v:"A",lv:3,l:"매우 원활"},{v:"B",lv:2,l:"원활한 편"},{v:"C",lv:1,l:"보통"},{v:"D",lv:1,l:"약한 편"},{v:"E",lv:0,l:"거의 안 됨"}]},
  // Q11 소통 어려운 상황 (2택, Other)
  {id:"q11",type:"multi",fullRows:true,cat:"문항 11 · 소통이 어려운 상황",q:"선생님은 다음 중 어떤 상황에서 소통이 어려우신가요?",hint:"2가지 상황을 선택해주세요.",max:2,
    options:[{v:"문제 상황에서 책임 소재를 두고 의견이 엇갈림"},{v:"상대방이 내 말을 잘 듣지 않거나, 자신의 의견만 강조함"},{v:"업무 전달이 명확하지 않아 무엇을 어떻게 해야 할지 혼란스러움"},{v:"감정이 섞인 대화로 인해 기분이 상함"},{v:"직급이나 역할 차이로 인해 의견을 자유롭게 표현하기 어려움"},{v:"기타"}]},
  // Q12 교육 일정 선호 (단일, Other)
  {id:"q12",type:"single",cat:"문항 12 · 교육 일정 선호도",q:"스트레스 관리 신규 프로그램을 시행한다면, 가장 선호하는 교육 일정을 선택해주세요.",
    options:["1일","1박 2일","2박 3일","기타"]},
  // Q13 근무 지역
  {id:"q13",type:"single",cat:"문항 13 · 근무 지역",q:"선생님의 근무 지역은 어디인가요?",options:["신촌","강남","용인"]},
  // Q14 연령대
  {id:"q14",type:"single",cat:"문항 14 · 연령대",q:"선생님의 나이는 어떻게 되시나요?",options:["20대","30대","40대","50대 이상"]},
  // Q15 근무 기간
  {id:"q15",type:"single",cat:"문항 15 · 근무 기간",q:"선생님께서 연세의료원과 함께한 기간은 어떻게 되시나요?",
    options:["1년 미만","1년 이상~5년 미만","5년 이상~10년 미만","10년 이상~15년 미만","15년 이상~20년 미만","20년 이상"]},
];

const KEYS="ABCDEFGHIJ".split("");
const answers={};
let idx=0;
const stage=document.getElementById('stage');
const fill=document.getElementById('fill');
const count=document.getElementById('count');
const topbar=document.getElementById('topbar');
const backBtn=document.getElementById('backBtn');
const nextBtn=document.getElementById('nextBtn');
let current=null;

function el(h){const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;}
const QTOTAL=survey.length-1;

function transitionTo(nc){const old=current;stage.appendChild(nc);requestAnimationFrame(()=>{nc.classList.add('active');if(old){old.classList.remove('active');old.classList.add('left');setTimeout(()=>old.remove(),400);}});current=nc;}

function progress(){topbar.style.visibility='visible';fill.style.width=(idx/QTOTAL*100)+'%';count.textContent=idx===0?'':`${idx}/${QTOTAL}`;backBtn.classList.toggle('show',idx>0);}

function alreadyDone(){try{return localStorage.getItem('pulseSurvey_'+CONFIG.WAVE)==='1';}catch(e){return false;}}
function markDone(){try{localStorage.setItem('pulseSurvey_'+CONFIG.WAVE,'1');}catch(e){}}

function hasOther(item){
  return item.options.some(o => (typeof o === 'string' ? o : o.v) === '기타');
}
function otherIsValid(item){
  const selected=answers[item.id];
  const picked=Array.isArray(selected) ? selected.includes('기타') : selected==='기타';
  return !picked || !!(answers[item.id+'_other']||'').trim();
}
function updateNextState(item){
  const selected=answers[item.id];
  const hasAnswer=Array.isArray(selected) ? selected.length>0 : !!selected;
  nextBtn.disabled=!hasAnswer || !otherIsValid(item);
}
function makeOtherInput(item){
  const wrap=el(`<div class="other-wrap"><input class="other-input" type="text" maxlength="20" placeholder="기타 내용을 입력하세요 (최대 20자)" aria-label="기타 내용"><span class="other-count">0/20</span></div>`);
  const input=wrap.querySelector('input');
  const countEl=wrap.querySelector('.other-count');
  input.value=answers[item.id+'_other']||'';
  countEl.textContent=`${input.value.length}/20`;
  input.oninput=()=>{
    answers[item.id+'_other']=input.value;
    countEl.textContent=`${input.value.length}/20`;
    updateNextState(item);
  };
  input.onclick=e=>e.stopPropagation();
  input.onkeydown=e=>{e.stopPropagation(); if(e.key==='Enter' && input.value.trim()){ advance(); }};
  return {wrap,input};
}
function setOtherVisible(other,visible,focus=false){
  if(!other)return;
  other.wrap.classList.toggle('show',visible);
  if(visible && focus)setTimeout(()=>other.input.focus(),0);
}

function build(item){
  const c=el(`<div class="card"></div>`);
  if(item.type==="intro"){
    c.classList.add('center','active');
    c.innerHTML=`<div class="bigmark"><svg viewBox="0 0 48 48" fill="none"><path d="M24 8l4 8 9 1-6.5 6 1.5 9-8-4.5-8 4.5 1.5-9L11 17l9-1z" fill="#fff" opacity=".9"/></svg></div>
      <h1>펄스 서베이</h1>
      <p>연세의료원 구성원의 마음을 살펴보는 짧은 설문입니다. 정답은 없어요. 지금 느낌 그대로 골라주세요.</p>
      <div class="meta"><span>15문항 · 약 3분</span><span>익명</span></div>
      <button class="start" id="startBtn">시작하기</button>`;
    stage.appendChild(c);current=c;
    c.querySelector('#startBtn').onclick=()=>{if(alreadyDone()){renderMsg('이미 참여하셨어요','이 기기에서 이번 설문에 이미 응답이 완료됐습니다. 감사합니다.');}else go(1);};
    return;
  }
  c.appendChild(el(`<div class="qnum">${item.cat}</div>`));
  c.appendChild(el(`<div class="qtext">${item.q}</div>`));
  if(item.hint)c.appendChild(el(`<div class="qhint">${item.hint}</div>`));

  if(item.type==="icon" || item.type==="wifi"){
    const box=el(`<div class="iconrow"></div>`);
    item.options.forEach(o=>{
      const graphic=item.type==='wifi'?wifi(o.lv,item.label):o.ic;
      const card=el(`<div class="icard"><div class="ig">${graphic}</div><div class="il">${o.l}</div></div>`);
      if(answers[item.id]===o.l)card.classList.add('sel');
      card.onclick=()=>{answers[item.id]=o.l;box.querySelectorAll('.icard').forEach(x=>x.classList.remove('sel'));card.classList.add('sel');setTimeout(advance,250);};
      box.appendChild(card);
    });
    c.appendChild(box);return c;
  }

  if(item.type==="single"){
    const box=el(`<div class="list"></div>`);
    let other=null;
    item.options.forEach((o,i)=>{
      const row=el(`<div class="lopt"><div class="key">${KEYS[i]}</div><div class="lt">${o}</div></div>`);
      if(answers[item.id]===o)row.classList.add('sel');
      row.onclick=()=>{
        answers[item.id]=o;
        box.querySelectorAll('.lopt').forEach(x=>x.classList.remove('sel'));
        row.classList.add('sel');
        if(o==='기타'){
          setOtherVisible(other,true,true);
          nextBtn.style.display='block';
          nextBtn.textContent=(idx===QTOTAL)?'제출':'다음';
          updateNextState(item);
        }else{
          setOtherVisible(other,false);setTimeout(advance,230);
        }
      };
      box.appendChild(row);
      if(o==='기타'){other=makeOtherInput(item);box.appendChild(other.wrap);}
    });
    setOtherVisible(other,answers[item.id]==='기타');
    c.appendChild(box);return c;
  }

  if(item.type==="multi"){
    answers[item.id]=answers[item.id]||[];
    c.appendChild(el(`<span class="badge">최대 ${item.max}개 · 기타 선택 시 입력 후 완료</span>`));
    const box=el(`<div class="mgrid"></div>`);
    let other=null;
    item.options.forEach((o,i)=>{
      const isLong=item.fullRows || o.v.length>14;
      const chip=el(`<div class="mopt ${o.c||''} ${isLong?'full':''}"><div class="mk">${KEYS[i]}</div><div class="mt">${o.v}</div></div>`);
      if(answers[item.id].includes(o.v))chip.classList.add('sel');
      chip.onclick=()=>{
        const arr=answers[item.id],at=arr.indexOf(o.v);
        if(at>=0){
          arr.splice(at,1);chip.classList.remove('sel');
          if(o.v==='기타')setOtherVisible(other,false);
        }else{
          if(arr.length>=item.max)return;
          arr.push(o.v);chip.classList.add('sel');
          if(o.v==='기타')setOtherVisible(other,true,true);
        }
        updateNextState(item);
        if(arr.length>=item.max && !arr.includes('기타'))setTimeout(advance,320);
      };
      box.appendChild(chip);
      if(o.v==='기타'){other=makeOtherInput(item);box.appendChild(other.wrap);}
    });
    setOtherVisible(other,answers[item.id].includes('기타'));
    c.appendChild(box);return c;
  }

  if(item.type==="multiopen"){
    answers[item.id]=answers[item.id]||[];
    c.appendChild(el(`<span class="badge">복수 선택 가능</span>`));
    const box=el(`<div class="list"></div>`);
    let other=null;
    item.options.forEach((o,i)=>{
      const row=el(`<div class="lopt"><div class="key">${KEYS[i]}</div><div class="lt">${o}</div></div>`);
      if(answers[item.id].includes(o))row.classList.add('sel');
      row.onclick=()=>{
        const arr=answers[item.id],at=arr.indexOf(o);
        if(at>=0){arr.splice(at,1);row.classList.remove('sel');if(o==='기타')setOtherVisible(other,false);}
        else{arr.push(o);row.classList.add('sel');if(o==='기타')setOtherVisible(other,true,true);}
        updateNextState(item);
      };
      box.appendChild(row);
      if(o==='기타'){other=makeOtherInput(item);box.appendChild(other.wrap);}
    });
    setOtherVisible(other,answers[item.id].includes('기타'));
    c.appendChild(box);return c;
  }
  return c;
}

function go(i){
  idx=i;
  if(idx>=survey.length){submit();return;}
  const item=survey[idx],card=build(item);
  if(item.type==="intro")return;
  transitionTo(card);progress();
  const needsButton=item.type==='multi'||item.type==='multiopen'||(item.type==='single' && answers[item.id]==='기타');
  nextBtn.style.display=needsButton?'block':'none';
  if(needsButton){nextBtn.textContent=(idx===QTOTAL)?'제출':(item.type==='multi'?'선택 완료':'다음');updateNextState(item);}
}
function advance(){go(idx+1);}
nextBtn.onclick=()=>advance();
backBtn.onclick=()=>{if(idx>1)go(idx-1);else{location.reload();}};

function renderMsg(title,body,ok){
  topbar.style.visibility='hidden';nextBtn.style.display='none';
  const icon = ok?`<div class="bigmark"><svg viewBox="0 0 48 48" fill="none"><path class="checkmark" d="M14 24l7 7 14-15" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`
    :`<div class="bigmark"><svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="3" fill="#fff"/><path d="M24 12v18" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></div>`;
  transitionTo(el(`<div class="card center active">${icon}<h1>${title}</h1><p>${body}</p></div>`));
}

function submit(){
  topbar.style.visibility='hidden';nextBtn.style.display='none';
  transitionTo(el(`<div class="card center active"><div class="spinner"></div><p style="margin-top:20px">응답을 저장하는 중…</p></div>`));
  const payload=Object.assign({wave:CONFIG.WAVE},answers);
  if(!CONFIG.ENDPOINT||CONFIG.ENDPOINT.indexOf('PASTE_')===0){
    setTimeout(()=>{markDone();renderMsg('참여해 주셔서 감사합니다','응답이 안전하게 기록되었습니다. 소중한 의견은 더 나은 조직문화를 만드는 데 활용됩니다.',true);},700);return;
  }
  fetch(CONFIG.ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
    .then(r=>r.json()).then(res=>{if(res&&res.ok){markDone();renderMsg('참여해 주셔서 감사합니다','응답이 안전하게 기록되었습니다. 소중한 의견은 더 나은 조직문화를 만드는 데 활용됩니다.',true);}else{renderMsg('전송 실패','네트워크 문제로 저장되지 않았습니다. 잠시 후 다시 시도해 주세요.');}})
    .catch(()=>renderMsg('전송 실패','네트워크 문제로 저장되지 않았습니다. 잠시 후 다시 시도해 주세요.'));
}

document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&idx>1)go(idx-1);});
build(survey[0]);
</script>
</body>
</html>
